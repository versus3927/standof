name: Femboy Strike Final Build

on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fix Directory Structure
        run: |
          mkdir -p app/src/main/cpp
          # Если файлы случайно остались в корне, переносим их в папку
          find . -maxdepth 1 -name "*.cpp" -exec cp {} app/src/main/cpp/ \;
          find . -maxdepth 1 -name "*.h" -exec cp {} app/src/main/cpp/ \;

      - name: Clone ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git imgui_lib
          cp -r imgui_lib/*.h app/src/main/cpp/

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Compile Native Library
        run: |
          mkdir -p build
          # Теперь мы точно знаем, что файлы там, потому что мы их сами перенесли!
          g++ -shared -fPIC -o build/libfemboy_strike.so app/src/main/cpp/*.cpp -Iapp/src/main/cpp -ldl

      - name: Package APK Manually
        run: |
          mkdir -p dist/assets
          cp build/libfemboy_strike.so dist/assets/
          cd dist && zip -r femboy-strike.apk . && cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FemboyStrikeFinalAPK
          path: dist/femboy-strike.apk
