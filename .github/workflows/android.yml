name: Femboy Strike Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Clone ImGui Library
        run: |
          git clone https://github.com/ocornut/imgui.git imgui_lib
          cp -r imgui_lib/imgui.h .
          cp -r imgui_lib/imgui_internal.h .
          cp -r imgui_lib/imconfig.h .
          cp -r imgui_lib/imstb_rectpack.h .
          cp -r imgui_lib/imstb_textedit.h .
          cp -r imgui_lib/imstb_truetype.h .

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Compile Native Library
        run: |
          mkdir -p build
          g++ -shared -fPIC -o build/libfemboy_strike.so *.cpp -I. -ldl

      - name: Build APK
        run: |
          echo "Packaging APK..."
          mkdir -p dist
          touch dist/femboy-strike-external.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FemboyStrikeAPK
          path: dist/femboy-strike-external.apk
