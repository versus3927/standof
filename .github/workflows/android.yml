name: Femboy Strike Final Build

on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Clone ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git imgui_lib
          cp -r imgui_lib/*.h app/src/main/cpp/

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Compile Native Library
        run: |
          # 1. Создаем папку для сборки
          mkdir -p build
          # 2. ПЕРЕХОДИМ В ПАПКУ С КОДОМ, чтобы компилятор всё видел!
          cd app/src/main/cpp
          # 3. Компилируем прямо здесь
          g++ -shared -fPIC -o ../../../build/libfemboy_strike.so *.cpp -I. -ldl

      - name: Package APK Manually
        run: |
          mkdir -p dist/assets
          cp build/libfemboy_strike.so dist/assets/
          cd dist && zip -r femboy-strike.apk . && cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FemboyStrikeFinalAPK
          path: dist/femboy-strike.apk
