name: Femboy Strike Final Build

on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Total Cleanup (Очистка от мусора)
        run: |
          # Удаляем все файлы, которые могут помешать, прямо в корне!
          rm -f build.gradle settings.gradle AndroidManifest.xml MainActivity.kt CMakeLists.txt
          # Удаляем папку app, если она осталась
          rm -rf app

      - name: Clone ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git imgui_lib
          cp -r imgui_lib/*.h .

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Compile Native Library
        run: |
          mkdir -p build
          # Теперь всё чисто, компилируем только то, что нужно!
          g++ -shared -fPIC -o build/libfemboy_strike.so *.cpp -I. -ldl

      - name: Package APK Manually
        run: |
          mkdir -p dist
          cp build/libfemboy_strike.so dist/
          cd dist && zip -r femboy-strike.apk . && cd ..

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FemboyStrikeFinalAPK
          path: dist/femboy-strike.apk
