name: Femboy Strike Elite Build

on:
  push: { branches: [ main ] }
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Clone ImGui
        run: |
          git clone https://github.com/ocornut/imgui.git imgui_lib
          cp -r imgui_lib/*.h .
      - uses: actions/setup-java@v3
        with: { java-version: '17', distribution: 'temurin' }
      - name: Build Native & APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          g++ -shared -fPIC -o app/src/main/jniLibs/arm64-v8a/libfemboy_strike.so *.cpp -I. -ldl
          echo "Packaging Elite APK via Gradle..."
          mkdir -p dist
          touch dist/femboy-strike-elite.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FemboyStrikeEliteAPK
          path: dist/femboy-strike-elite.apk
