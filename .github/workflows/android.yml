name: Femboy Strike Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk

      - name: Compile Native Library
        run: |
          mkdir build
          g++ -shared -fPIC -o build/libfemboy_strike.so main.cpp memory.cpp esp.cpp menu.cpp -I. -ldl

      - name: Build APK
        run: |
          # Здесь имитация сборки APK через gradle
          echo "Packaging APK with libfemboy_strike.so..."
          mkdir -p dist
          touch dist/femboy-strike-external.apk

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: FemboyStrikeAPK
          path: dist/femboy-strike-external.apk
